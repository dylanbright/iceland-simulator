<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iceland Simulator</title>
  <meta name="description" content="A browser game about running a farm, a family and a reputation in early medieval Iceland.">
  <link rel="icon" type="image/png" href="art/favicon.png">
  <link rel="stylesheet" href="css/art.css">
  <link rel="stylesheet" href="css/style.css">

<body>
  <div id="app" aria-live="polite"></div>

  <script src="js/core/rules.js"></script>
  <script src="js/core/calendar.js"></script>
  <script src="js/data/names.js"></script>
  <script src="js/data/traits.js"></script>
  <script src="js/core/person.js"></script>
  <script src="js/core/ancestry.js"></script>
  <script src="js/core/start.js"></script>
  <script src="js/core/economy.js"></script>
  <script src="js/core/raid.js"></script>
  <script src="js/core/marriage.js"></script>
  <script src="js/core/feud.js"></script>
  <script src="js/core/saga.js"></script>
  <script src="js/core/history.js"></script>
  <script src="js/core/stable.js"></script>
  <script src="js/data/farm-events.js"></script>
  <script src="js/data/incidents.js"></script>
  <script src="js/data/events.js"></script>

  <script src="js/core/household.js"></script>

  <script src="js/ui/dom.js"></script>
  <script src="js/ui/start-screen.js"></script>
  <script src="js/ui/play-screen.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
